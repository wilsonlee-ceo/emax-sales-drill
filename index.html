<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Emax Sales Drill</title>
<style>
:root {
  color-scheme: light;
  --bg: #f8f8f7;
  --surface: #ffffff;
  --border: #e9e9e7;
  --text: #1f1f1f;
  --text-secondary: #6e6e6e;
  --primary: #2c2c2c;
  --primary-text: #ffffff;
  --accent: #b8854d;
  --accent-bg: #faf3e8;
  --success: #2d7a4d;
  --warning: #c95f1e;
  --danger: #c0392b;
  --radius: 12px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); padding-bottom: 84px; position: relative; }
.header { background: var(--surface); padding: 12px 16px 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.header-title h1 { font-size: 17px; font-weight: 600; line-height: 1.2; }
.header-title p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; line-height: 1.2; }
.lang-switch { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 2px; font-size: 12px; flex-shrink: 0; }
.lang-switch button { border: none; background: none; padding: 4px 10px; border-radius: 14px; cursor: pointer; font-family: inherit; font-size: 12px; color: var(--text-secondary); }
.lang-switch button.active { background: var(--primary); color: var(--primary-text); }
.content { padding: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.card-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; line-height: 1.3; }
.card-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.card-body { font-size: 13px; color: var(--text); }
.tag { display: inline-block; padding: 2px 8px; background: var(--accent-bg); color: var(--accent); border-radius: 4px; font-size: 11px; margin-right: 6px; font-weight: 500; }
.tag.dim { background: var(--bg); color: var(--text-secondary); }
.btn { display: inline-block; padding: 12px 18px; background: var(--primary); color: var(--primary-text); border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 500; cursor: pointer; text-align: center; width: 100%; font-family: inherit; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: var(--danger); color: white; }
.input, .textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: inherit; background: var(--surface); color: var(--text); resize: vertical; }
.textarea { min-height: 70px; }
.tabbar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--surface); border-top: 1px solid var(--border); max-width: 480px; margin: 0 auto; z-index: 20; padding-bottom: env(safe-area-inset-bottom, 0); }
.tab { flex: 1; padding: 10px 4px 12px; text-align: center; cursor: pointer; border: none; background: none; font-family: inherit; color: var(--text-secondary); }
.tab.active { color: var(--primary); }
.tab-icon { display: block; font-size: 20px; margin-bottom: 2px; line-height: 1; }
.tab-label { font-size: 11px; }
.scenario-grid { display: flex; flex-direction: column; gap: 8px; }
.scenario-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; cursor: pointer; text-align: left; width: 100%; font-family: inherit; font-size: inherit; color: var(--text); }
.scenario-card:active { background: var(--accent-bg); }
.level-pill { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-right: 6px; font-weight: 500; }
.level-1 { background: #e3f3e7; color: #2d7a4d; }
.level-2 { background: #fff4e0; color: #c95f1e; }
.level-3 { background: #fde8e6; color: #c0392b; }
.chat { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
.bubble.customer { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.bubble.staff { align-self: flex-end; background: var(--primary); color: var(--primary-text); border-bottom-right-radius: 4px; }
.bubble-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 2px; }
.bubble.staff .bubble-label { color: rgba(255,255,255,0.7); }
.score-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; gap: 8px; }
.score-row:last-of-type { border-bottom: none; }
.score-row > span:first-child { flex-shrink: 0; }
.score-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; max-width: 100px; }
.score-bar-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
.stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
.stat-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 8px; text-align: center; }
.stat-num { font-size: 22px; font-weight: 600; color: var(--primary); line-height: 1.2; }
.stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.search-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text); }
.toggle-row { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin: 10px 0 10px; padding: 3px; gap: 3px; }
.toggle-btn { flex: 1; padding: 8px; text-align: center; border: none; background: none; cursor: pointer; font-family: inherit; font-size: 13px; color: var(--text-secondary); border-radius: 6px; }
.toggle-btn.active { background: var(--primary); color: var(--primary-text); }
.cat-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
.cat-row::-webkit-scrollbar { display: none; }
.cat-chip { flex-shrink: 0; padding: 6px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; cursor: pointer; font-family: inherit; color: var(--text); white-space: nowrap; }
.cat-chip.active { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
.empty { text-align: center; color: var(--text-secondary); padding: 40px 20px; font-size: 13px; }
.loading { text-align: center; color: var(--text-secondary); padding: 16px; font-size: 13px; }
.recording-pulse { display: inline-block; width: 10px; height: 10px; background: var(--danger); border-radius: 50%; animation: pulse 1.2s ease-in-out infinite; margin-right: 8px; vertical-align: middle; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.transcript { background: var(--accent-bg); border: 1px solid #f0e1c8; border-radius: var(--radius-sm); padding: 12px; font-size: 14px; min-height: 60px; margin-bottom: 12px; white-space: pre-wrap; line-height: 1.5; }
.feedback-section { margin-top: 14px; }
.feedback-title { font-weight: 600; margin-bottom: 8px; font-size: 13px; }
.feedback-item { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); padding: 10px 12px; margin-bottom: 8px; font-size: 13px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; line-height: 1.5; }
.dim-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 8px; margin-right: 6px; font-weight: 600; letter-spacing: 0.2px; vertical-align: middle; }
.dim-badge.dim-profile { background: #e3f0fa; color: #1d5a8e; }
.dim-badge.dim-frame { background: #d6eef1; color: #147984; }
.dim-badge.dim-root { background: #fff4e0; color: #c95f1e; }
.dim-badge.dim-reframe { background: #f0e6f9; color: #6b2c91; }
.dim-badge.dim-close_dim { background: #e3f3e7; color: #2d7a4d; }
.dim-badge.dim-compliance { background: #e1e7ed; color: #2c3e50; }
.dim-badge.dim-authority { background: #fde8e6; color: #c0392b; }
.feedback-item.cat-profile { border-left-color: #1d5a8e; }
.feedback-item.cat-frame { border-left-color: #147984; }
.feedback-item.cat-root { border-left-color: #c95f1e; }
.feedback-item.cat-reframe { border-left-color: #6b2c91; }
.feedback-item.cat-close_dim { border-left-color: #2d7a4d; }
.feedback-item.cat-compliance { border-left-color: #2c3e50; }
.feedback-item.cat-authority { border-left-color: #c0392b; }
.notice { background: var(--accent-bg); border: 1px solid #f0e1c8; color: #6b4423; padding: 12px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 12px; line-height: 1.5; }
.error-box { background: #fde8e6; border: 1px solid #f5b9b3; color: #8a2920; padding: 12px; border-radius: var(--radius-sm); font-size: 12px; margin-top: 12px; line-height: 1.5; }
.error-box pre { margin-top: 6px; font-size: 11px; white-space: pre-wrap; background: rgba(0,0,0,0.05); padding: 6px; border-radius: 4px; max-height: 200px; overflow: auto; }
hr.sep { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.back-btn { background: none; border: none; color: var(--accent); font-size: 14px; padding: 0; margin-bottom: 12px; cursor: pointer; font-family: inherit; }
.kv-row { margin-top: 8px; font-size: 13px; line-height: 1.5; }
.section-title { font-size: 14px; font-weight: 600; margin: 14px 0 8px; }
.persona-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; font-size: 12px; }
.persona-row > div { background: var(--bg); padding: 6px 8px; border-radius: 6px; }
.persona-row strong { display: block; color: var(--text-secondary); font-size: 10px; font-weight: 500; margin-bottom: 2px; }
.hint-btn { display: inline-flex; align-items: center; gap: 4px; background: none; border: 1px dashed var(--border); padding: 4px 10px; border-radius: 12px; font-size: 11px; color: var(--text-secondary); cursor: pointer; font-family: inherit; align-self: flex-end; margin-top: -4px; margin-right: 0; }
.hint-btn:active { background: var(--bg); }
.hint-card { align-self: flex-end; max-width: 82%; background: #f0f7e8; border: 1px solid #d4e4c0; border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12px; line-height: 1.55; color: #3a5024; margin-top: 2px; white-space: pre-wrap; }
.hint-card-label { font-size: 10px; font-weight: 600; color: #5a7a3a; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.hint-loading { align-self: flex-end; font-size: 11px; color: var(--text-secondary); padding: 6px 10px; }
.say-more-btn { margin-top: 10px; background: none; border: 1px dashed var(--border); padding: 5px 12px; border-radius: 12px; font-size: 11px; color: var(--text-secondary); cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 4px; }
.say-more-btn:active { background: var(--bg); }
.say-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.expanded-feedback { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 12px; line-height: 1.65; color: #4a4a4a; white-space: pre-wrap; }
.expanded-feedback-loading { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--text-secondary); text-align: center; }
.card-tag { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; font-size: 11px; padding: 3px 10px; background: var(--accent-bg); color: var(--accent); border-radius: 10px; margin-top: -4px; margin-bottom: 6px; font-weight: 500; }
.card-tag::before { content: '🎴'; font-size: 11px; }
.modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--surface); border-radius: var(--radius); padding: 20px; max-width: 400px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 17px; margin-bottom: 8px; }
.modal p { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.5; }
.modal .input { font-family: ui-monospace, monospace; font-size: 12px; }
.warn-box { background: #fff4e0; border: 1px solid #f0c890; color: #8a4520; padding: 10px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 12px; line-height: 1.5; }

  { id: 'f1', cat: 'frame', name_en: 'Authoritative Framing (Expert)', name_zh: '权威框架 (专家)', when_en: 'Customer is confused or all over the place', when_zh: '客户混乱 没方向', body_en: 'Behave like a doctor or architect, not a salesgirl. Make her feel "she knows what she is doing, I just follow." Present ONE main path, not 5 options. Eye contact, calm voice, slow pace. Close with a clear choice, not an open question.', body_zh: '像医生或建筑师 不是售货员 让她感觉 "她很专业 我跟着走就行" 给一条主路 不是五个选项 眼神 语速 沉稳 用清楚的选择收尾', risk_en: 'Do not ask "so what do you want to do?" Do not sound unsure.', risk_zh: '别问 "那你想做什么" 别犹豫不决' },
  { id: 'f2', cat: 'frame', name_en: 'Pain Uncovering + Future Painting', name_zh: '挖痛点 + 描绘未来', when_en: 'Customer is emotional, insecure', when_zh: '客户情绪化 没自信', body_en: 'Pull out emotional truth behind the skin problem. Then paint how her life or identity changes. Ask "when did this start to bother you most?" Then "imagine 6 months later, your jawline is sharper, how would that change how you show up at work?"', body_zh: '挖出皮肤问题背后的情绪 然后描绘她生活或身份的改变 "什么时候开始最困扰你" "想象六个月后 你的下颌更清晰 你工作的状态会有什么不同"', risk_en: 'Do not jump to package. Stay in emotional space without being awkward.', risk_zh: '别直接跳到套餐 在情绪空间多停一会 别尴尬' },
  { id: 'f3', cat: 'frame', name_en: 'Value Anchoring + ROI Framing', name_zh: '价值锚定 + ROI 框架', when_en: 'Customer is price sensitive', when_zh: '客户对价格敏感', body_en: 'Shift from "expensive or not" to "worth it or not". Make her see treatment as investment. "This concern has been with you for how many years already?" "If we do not treat it properly now, it becomes harder and more expensive later."', body_zh: '把 "贵不贵" 转成 "值不值" 让她看作投资 "这个困扰你多少年了" "现在不解决 后面更贵更难"', risk_en: 'Do not say "ya, a bit expensive la". Do not panic and discount.', risk_zh: '别说 "对啊 有点贵" 别慌着打折' },
  { id: 'f4', cat: 'frame', name_en: 'Strong Technical Explanation', name_zh: '专业技术解释', when_en: 'Customer is analytical, asks how it works', when_zh: '客户偏理性 问原理', body_en: 'Clear, simple explanation without losing authority. "Let me explain in 3 parts: surface, middle, deeper layer." Use visual analogies. Always link back to this customer specifically.', body_zh: '简单清晰 但不失权威 "我分三层说: 表层 中层 深层" 用比喻 永远链回到这位客户的情况', risk_en: 'Never say "I am not sure but...". Hold frame even if unsure.', risk_zh: '别说 "我也不确定但是" 不确定也要保持框架' },
  { id: 'f5', cat: 'frame', name_en: 'Competitive Framing', name_zh: '竞争框架', when_en: 'Customer compares brands', when_zh: '客户比较品牌', body_en: 'Position as superior choice without bad-mouthing others. "We do not just do facial. We build a treatment roadmap and monitor progress." "Other clinics may be cheaper per session, but we are cheaper per result."', body_zh: '定位为更优选择 但不踩同行 "我们不止做护理 我们设计疗程路线图并追踪进度" "别家可能每次便宜 但我们每次结果更便宜"', risk_en: 'Do not shrink or panic when competitor is cheaper.', risk_zh: '别人便宜的时候 不要慌 不要退缩' },
  { id: 'f6', cat: 'frame', name_en: 'Empowerment Framing', name_zh: '赋能框架', when_en: 'Customer says "must ask husband"', when_zh: '客户说 "要问老公"', body_en: 'Validate her reality, then gently shift to self-ownership. "I understand, your husbands opinion matters." "Why not start with a smaller plan you can decide on your own first?" Never attack husband or family.', body_zh: '先认同 再温和转向自我赋权 "我理解 你老公的意见很重要" "要不先从一个你能自己决定的小方案开始" 绝不攻击老公', risk_en: 'Never say "do not let your husband control you".', risk_zh: '绝对不要说 "别让老公控制你"' }
];

const VALUE_CARDS = [
  { id: 'v1', cat: 'value', name_en: 'Treatment Plan (Why it works)', name_zh: '疗程逻辑 (为什么有效)', when_en: 'Customer doubts effectiveness', when_zh: '客户怀疑效果', body_en: 'Rebuild trust through science and logic. "This works because it targets the root cause at the dermal layer, not just the surface."', body_zh: '用科学和逻辑重建信任 "这个有效是因为它针对真皮层的根本原因 不只是表面"', risk_en: 'Avoid jargon dump. Check in: "does that make sense?"', risk_zh: '别堆专业词 要确认' },
  { id: 'v2', cat: 'value', name_en: 'Timeline (Expectation Clarity)', name_zh: '时间线 (清晰预期)', when_en: 'Customer asks "how fast"', when_zh: '客户问 "多快见效"', body_en: 'Paint a visual journey. "In 4 weeks, smoother texture. By 8 weeks, deeper repairs kick in."', body_zh: '画出过程 "4 周后 肤质变细腻 8 周后深层修复启动"', risk_en: 'Do not promise instant.', risk_zh: '别承诺立竿见影' },

  { id: 'v4', cat: 'value', name_en: 'Customisation (Tailored)', name_zh: '定制 (量身打造)', when_en: 'Customer feels skeptical or sensitive', when_zh: '客户怀疑或敏感', body_en: 'Drop 2-3 personalised observations from her consultation. "This plan is designed specifically for your triggers."', body_zh: '引用 2-3 个咨询时的具体观察 "这个方案是为你的特点设计的"', risk_en: 'Show you remember details.', risk_zh: '让她感觉你记住了细节' },

  { id: 'v6', cat: 'value', name_en: 'Guidance (Partnership)', name_zh: '陪伴 (合作伙伴)', when_en: 'Customer is emotional, afraid to commit', when_zh: '客户情绪化 不敢承诺', body_en: 'Sell the relationship, not the package. "I will be with you through the journey."', body_zh: '卖的是关系 不是套餐 "我会陪你走完这段路"', risk_en: 'Stay professional. Do not become "best friend" mode.', risk_zh: '保持专业 别变成 "闺蜜模式"' }

  const summarize6R = () => SIX_R.map(s => `${s.en_name} (${s.zh_name}, ${s.phase_en}): ${s.mean_en}`).join('\n');

  return `You are the AI brain of the Emax Sales Drill app. Emax is an aesthetic medical clinic. You roleplay as customers and grade sales performance using the Emax 4D Closing System.

=== EMAX 4D CLOSING SYSTEM ===
The 4D system: Profile -> Root Cause -> Reframe -> Safe Close. 40 consultant cards across 6 categories.

${summarize4D(FRAME_CARDS, 'FRAME CARDS (set tone)')}

${summarize4D(VALUE_CARDS, 'VALUE CARDS (build value)')}

${summarize4D(ROOT_CARDS, 'ROOT CARDS (handle root objections)')}

${summarize4D(CLOSE_CARDS, 'CLOSING CARDS (named closes)')}

${summarize4D(ELITE_CARDS, 'ELITE REFRAME SCRIPTS')}

${summarize4D(JOKER_CARDS, 'JOKER CARDS')}

=== 26 CUSTOMER PERSONAS ===
${summarizePersonas()}

=== 6R CUSTOMER JOURNEY ===
${summarize6R()}

=== EXECUTIVE SUMMARY: SALES TEAM PROBLEM AND GAP (May 2026, latest from Notion) ===

CORE PROBLEM:
The sales team is still selling through relationship, explanation, comfort, and package pushing. But the market has shifted into fear, regulation, safety, documentation, and medical trust. So the sales method is mismatched with the current business battlefield.

Their communication is too broad, too soft, and too explanation heavy. The message does not create enough certainty or urgency to close. They try to keep customers comfortable - useful for service, weak for qualification and closing. Their wording can damage the deal: wrong explanation creates doubt, fear, compliance risk, or weak trust. They act as representatives of the brand but lack a stronger authority based script.

MARKET MISMATCH:
The market now wants authority, safety, proof, and structure. The team is still operating through flow, relationship, comfort, and adjustment. The market now demands clarity, rules, process, confidence, and evidence. That is the mismatch.

EVIDENCE (numbers do not lie):
- Low consult-to-enrollment conversion for new customers. Means they cannot close without a relationship to lean on.
- Rising refund rate WITHOUT service complaints. Means they over-pressure existing relationships and customers feel pushed, not served.
- Pattern shows: 1-tool sales method while sitting on a 40-card 4D library.

THE 7 MAIN GAPS:
1. They cannot sell safety clearly. They know how to sell treatment benefits, not medical safety, screening, suitability, doctor assessment.
2. They lack compliance language. Casual answers become operational risk.
3. They overexplain instead of directing. Customer gets more information, less certainty.
4. They lack structured qualification. Cannot filter who is suitable, who needs doctor review, who should not proceed, who is ready to buy.
5. They are weak at fear conversion. Do not know how to turn customer fear (safety, price, regulation, trust, market noise) into trust.
6. They are still promotion trained. Strong on price, package, discount, relationship. Weak on authority, diagnosis, risk control, proper protocol.
7. They are not acting as a clinical advisory bridge. Still behaving as beauty consultants, not the bridge between customer concern and doctor led decision.

RAW DIAGNOSIS:
The team is not useless. They are built for the previous market (beauty desire, promotion, package, results, relationship). The current market is regulation, fear, medical trust, compliance, safety, defensibility. That is the gap.

WHY THIS MATTERS FOR YOUR GRADING:
When you grade, do not only score on tactical 4D moves. Where appropriate, connect a tactical failure to one of these 7 gaps. Example: if salesperson over-explains in response to a safety question, this is gap #3 (overexplain instead of directing) and gap #1 (cannot sell safety clearly). Naming the broader gap helps coaches see the pattern, not just the moment.

THE NEW SALES OPERATING SYSTEM THEY NEED:
1. Approved script (named 4D cards)
2. Compliance safe wording
3. Customer qualification checklist before pricing
4. Doctor escalation rule (when in doubt, escalate)
5. Fear handling framework (proof and process, not comfort)
6. Treatment suitability explanation
7. Closing script based on safety and trust
8. Strict control on claims and promises (no medical guarantees)

BOTTOM LINE:
The problem is not only skill. It is the wrong sales architecture for the new regulatory environment. They are still selling like beauty salespeople. They now need to sell like structured clinical consultants with controlled language, stronger qualification, and authority backed confidence.

=== TEACHING PHILOSOPHY: Cards are flexible, sequence is sacred ===

CORE PRINCIPLE:
The 4D system is not a quiz with one right answer per situation. It is a flexible toolkit. For any given customer moment, MULTIPLE card combinations are valid. What matters is the SEQUENCE, not the specific card choice.

THE SEQUENCE (the part that is non-negotiable):
1. FRAME first (set the consultation tone for this customer type)
2. VALUE before price (build worth before mentioning numbers)
3. ROOT before reframe (uncover real fear, do not just answer surface objection)
4. CLOSE with intention (use a named close, not relationship pressure)

Within this sequence, MANY combinations work. Examples of valid paths for the same customer:

For a price-sensitive customer:
- Path A: Authoritative Frame -> Value Anchoring (ROI) -> Choice Close. Solid, structured.
- Path B: Pain Uncovering Frame -> Premium Standard Value -> Goal Anchored Close. Emotional anchor.
- Path C: Empowerment Frame -> Customisation Value -> Soft Close (Enrollment). Lower commitment, secure next visit.
- Path D: Competitive Frame -> Treatment Plan Value -> Walkaway Authority Close. If she truly cannot afford.

All four paths are valid. A skilled consultant has 3+ paths in pocket.

What is NOT valid (the actual gap):
- No frame, jump straight to package -> relationship pressure -> hope to close.
- This is what the team currently does. This is what we are training out.

YOUR JOB AS COACH:
When grading, do NOT prescribe one right card. Do this instead:

1. Acknowledge what the staff DID and which cards their words map to (even if imperfect).
2. Identify which step of the sequence they SKIPPED (frame? value? root? close?).
3. Show 2 or 3 ALTERNATIVE valid paths they could have taken, using DIFFERENT card combinations.
4. Highlight the principle: any cards work as long as the sequence is followed.

This teaches JUDGMENT, not memorization. Staff who learn judgment can handle customers we never wrote scenarios for. Staff who memorize 1 right answer per scenario will fail in the wild.

WHEN GIVING COACH HINTS (mid-drill):
Show 2-3 cards that could work for this moment, plus the principle. Not "use X". Instead "any of A, B, or C would work, the principle is Y."

WHEN GRADING (post-drill):
In each feedback item, name the dimension (profile/root/reframe/close_dim/authority), describe what the staff did, then show alternative valid paths. End with the underlying principle.

=== YOUR MODES ===

MODE A - CUSTOMER ROLEPLAY (STRICT):

You are the CUSTOMER seeking aesthetic medical consultation. You are NEVER the salesperson, NEVER the consultant, NEVER a "helpful assistant".

ABSOLUTE RULES (do not break, ever):
1. Stay in character as the customer no matter what the salesperson says.
2. NEVER offer plans, packages, treatments, or recommendations. That is the salesperson's job, not yours.
3. NEVER ask the salesperson "what would you like to improve" or "what can I help you with" or similar consultant-type questions.
4. NEVER thank the salesperson for coming. NEVER welcome them. The customer is the one being served, not the one serving.
5. NEVER say things like "the fact you came today means you've made up your mind" or "let's spend a few minutes understanding what you want to improve". That is consultant speak.
6. Reply 1-3 sentences, natural, like a real customer. Push back, doubt, ask follow-ups. You are not easily sold to.
7. Use the language specified in the user message. Do not switch languages mid-conversation.
8. Do not prefix your reply with "Customer:" or "客户:" or any tag.

WHEN THE SALESPERSON SAYS WEIRD OR NONSENSE THINGS:
You stay in character as a confused, slightly impatient customer. You do NOT take over and become helpful.

Examples of weird salesperson input and how the customer should respond:

- Salesperson: "Yes" → Customer: "Yes to what? I haven't asked you anything yet." or "嗯？我又没问你东西。"
- Salesperson: "Hello hello hello" → Customer: "Hi... were you going to say something?" or "你好... 你想说什么吗"

- Salesperson: just an emoji → Customer: gives a confused look, says nothing or "你在干嘛"

You stay in your customer character. You do NOT rescue the conversation by becoming the consultant.

MODE B - SALES COACH GRADER:
When the user message starts with [GRADE] or asks for grading, score the SALES side of the transcript on 6 dimensions, each 0, 1, or 2:
- profile: identified the customer type and real need (matched to one of the 26 personas)
- frame: set the right framing approach for this customer type. Did they use one of the 6 FRAME cards (Authoritative, Pain Uncovering + Future Painting, Value Anchoring + ROI, Strong Technical Explanation, Competitive Framing, Empowerment Framing)? Or did they skip framing entirely?
- root: uncovered real fear, not just surface objection
- reframe: reframed instead of defending or apologizing (use ELITE REFRAME SCRIPTS or ROOT card reframes)
- close_dim: attempted a specific named close from the 4D library (mention which card by name in feedback)
- compliance: safe wording (no medical guarantees, no "we promise this result"), escalated to doctor when appropriate, controlled claims and promises. This addresses May Gap #2 (lacks compliance language) and Gap #7 (clinical advisory bridge).

Then write 3 specific improvement points using the multi-path teaching format from TEACHING PHILOSOPHY.

CRITICAL: When grading, output ONLY valid JSON. No prose. No code fences. No preamble. Format exactly:
{"profile":N,"frame":N,"root":N,"reframe":N,"close_dim":N,"compliance":N,"feedback":[{"dim":"...","text":"..."},{"dim":"...","text":"..."},{"dim":"...","text":"..."}]}

MODE C - SENIOR CONSULTANT DEMONSTRATION:

When the user message starts with [CONSULTANT_DEMO] or asks you to play the consultant, you become the senior Emax consultant with 10+ years experience demonstrating perfect execution of the 4D Closing System. The trainee is roleplaying as the customer.

Your job:
- Be the senior consultant they should aspire to be
- Use the FRAME -> VALUE -> ROOT -> CLOSE sequence cleanly. Pick the right card for each moment.
- Stay compliance-safe (no medical guarantees, no "we promise X result", escalate to doctor when appropriate)
- 1 to 3 sentences usually. Slightly longer (4-5) when explaining a treatment or value.
- Match the customer's emotional state. If they are angry, calm authority. If they are crying, containment. If they are challenging, demonstrate, not defend.
- Reply in the language specified.

CRITICAL OUTPUT FORMAT FOR MODE C:
ALWAYS end your response with a card tag on a NEW LINE, in this exact format:
<<Card: [card name]>>

Where card name is the specific 4D card you primarily used in this turn. Pick from the actual library:
- FRAME cards: "Authoritative Framing", "Pain Uncovering + Future Painting", "Value Anchoring + ROI", "Strong Technical Explanation", "Competitive Framing", "Empowerment Framing"
- VALUE cards: "Treatment Plan", "Timeline", "Social Proof", "Customisation", "Premium Standard & Brand", "Guidance"
- ROOT cards: "Root Card 1 - Fear of Wasting Money", "Root Card 2 - Fear of No Results", "Root Card 3 - Fear of Commitment", "Root Card 4 - Need to Ask Husband", "Root Card 5 - Not Emotionally Ready", "Root Card 6 - Don't Trust Clinics"
- CLOSING cards: "Choice Close", "Goal Anchored Close", "Silence Close", "Assumptive Close", "Priority Close", "Value Ladder Close", "Soft Close (Enrollment)", "Reservation Close (Deposit)", "Future Close", "Walkaway Authority Close"
- ELITE REFRAME: "Elite Reframe 1" through "Elite Reframe 10" (or paraphrase the script)
- JOKER: "4S Emotional Disarm", "10 Rules of Elite Sales"
- For early greeting/listening: "Active Listening" or "Welcome / Reassure"

If you used multiple cards, name the PRIMARY one for that turn.

Example output:

<<Card: Pain Uncovering + Future Painting>>"

Stay strict on format. The trainee sees the card tag as a learning marker.`;

const SYSTEM_PROMPT = buildSystemPrompt();

async function callClaude(messages, maxTokens) {
  const apiKey = loadKey();
  if (!apiKey) throw new Error('NO_KEY');
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: maxTokens || 800,
      system: SYSTEM_PROMPT,
      messages: messages
    })
  });
  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`API ${response.status}: ${errText.slice(0, 300)}`);
  }
  const data = await response.json();
  return (data.content && data.content[0] && data.content[0].text) || '';
}

async function translateBatch(items, targetLang) {
  if (!items || items.length === 0) return null;
  const langName = targetLang === 'zh' ? 'Chinese (Mandarin, simplified)' : 'English';
  const prompt = `Translate these ${items.length} items into ${langName}. Preserve meaning and tone. Output ONLY a JSON array of exactly ${items.length} strings, in the same order. No prose, no code fences, no preamble.

${items.map((s, i) => `[${i}] ${s}`).join('\n')}`;
  let raw = '';
  try { raw = await callClaude([{ role: 'user', content: prompt }], 2500); }
  catch (e) { return null; }
  const a = raw.indexOf('[');
  const b = raw.lastIndexOf(']');
  if (a < 0 || b <= a) return null;
  try {
    const arr = JSON.parse(raw.slice(a, b + 1));
    if (Array.isArray(arr) && arr.length === items.length) return arr;
  } catch (e) {}
  return null;
}

  const refs = [];
  // Helper: pull translatable fields from a feedback array
  const pushFeedback = (fbArr) => {
    if (!Array.isArray(fbArr)) return;
    fbArr.forEach(f => {
      if (typeof f === 'object' && f) {
        if (f.text) { items.push(f.text); refs.push({ obj: f, key: 'text' }); }
        if (f.expanded) { items.push(f.expanded); refs.push({ obj: f, key: 'expanded' }); }
      }
    });
  };
  if (STATE.tab === 'roleplay' && STATE.scenario) {
    if (STATE.conversation.length > 0) {
      STATE.conversation.forEach(m => {
        if (m.text) { items.push(m.text); refs.push({ obj: m, key: 'text' }); }
        if (m.hintText) { items.push(m.hintText); refs.push({ obj: m, key: 'hintText' }); }
      });
    }
    if (STATE.pendingReplyText) {
      items.push(STATE.pendingReplyText);
      refs.push({ obj: STATE, key: 'pendingReplyText' });
    }
    // Live grade currently shown
    if (STATE.currentGrade && STATE.currentGrade.breakdown) {
      pushFeedback(STATE.currentGrade.breakdown.feedback);
    }
  } else if (STATE.tab === 'voice' && STATE.scenario && STATE.conversation.length > 0) {
    // Demo mode: translate conversation messages (consultant + customer-user)
    STATE.conversation.forEach(m => {
      if (m.text) { items.push(m.text); refs.push({ obj: m, key: 'text' }); }
    });
    if (STATE.pendingReplyText) {
      items.push(STATE.pendingReplyText);
      refs.push({ obj: STATE, key: 'pendingReplyText' });
    }
  } else if (STATE.tab === 'dashboard' && STATE.viewingSession) {
    const s = STATE.viewingSession;
    if (s.conversation && Array.isArray(s.conversation)) {
      s.conversation.forEach(m => {
        if (m.text) { items.push(m.text); refs.push({ obj: m, key: 'text' }); }
        if (m.hintText) { items.push(m.hintText); refs.push({ obj: m, key: 'hintText' }); }
      });
    } else if (s.transcript) {
      items.push(s.transcript);
      refs.push({ obj: s, key: 'transcript' });
    }
    if (s.breakdown) {
      pushFeedback(s.breakdown.feedback);
    }
  }
  if (items.length === 0) return;
  const overlay = document.createElement('div');
  overlay.id = 'tr-overlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal" style="text-align:center; padding:24px;"><div class="loading" style="padding:0;">${targetLang === 'zh' ? '翻译中...' : 'Translating...'}</div></div>`;
  document.body.appendChild(overlay);
  const translated = await translateBatch(items, targetLang);
  overlay.remove();
  if (translated && translated.length === items.length) {
    refs.forEach((r, i) => { r.obj[r.key] = translated[i]; });
  }
}

async function testApiKey(keyValue) {
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': keyValue,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 10,
        messages: [{ role: 'user', content: 'Say OK' }]
      })
    });
    return r.ok;
  } catch (e) { return false; }
}

function parseGradeJson(s) {
  if (!s) return null;
  let txt = s.replace(/```json\s*/gi, '').replace(/```\s*$/g, '').trim();

  // Try strict JSON first
  const a = txt.indexOf('{');
  const b = txt.lastIndexOf('}');
  if (a >= 0 && b > a) {
    let candidate = txt.slice(a, b + 1);
    try { return JSON.parse(candidate); } catch (e) {}
    try {
      candidate = candidate.replace(/,(\s*[}\]])/g, '$1').replace(/'/g, '"');
      return JSON.parse(candidate);
    } catch (e) {}
  }

  // Fallback: response may be truncated. Extract scores and feedback by regex.
  const dims = ['profile', 'frame', 'root', 'reframe', 'close_dim', 'compliance', 'authority'];
  const scores = {};
  dims.forEach(d => {
    const m = txt.match(new RegExp('"' + d + '"\\s*:\\s*(\\d)'));
    if (m) scores[d] = parseInt(m[1], 10);
  });
  if (Object.keys(scores).length < 3) return null;
  // Default missing common dims to 0
  ['profile', 'frame', 'root', 'reframe', 'close_dim', 'compliance'].forEach(d => { if (scores[d] === undefined) scores[d] = 0; });

  // Extract feedback items
  const feedback = [];
  const fbStart = txt.indexOf('"feedback"');
  if (fbStart >= 0) {
    const after = txt.slice(fbStart);
    // Try new structured format first: {"dim":"...","text":"..."}
    const objItems = [...after.matchAll(/"dim"\s*:\s*"([^"]+)"\s*,\s*"text"\s*:\s*"((?:[^"\\]|\\.)+?)"/g)];
    if (objItems.length > 0) {
      objItems.forEach(m => feedback.push({ dim: m[1], text: m[2] }));
    } else {
      // Fall back to old format (array of plain strings)
      const items = [...after.matchAll(/"((?:[^"\\]|\\.)+?)"/g)];
      items.slice(1).forEach(m => {
        const v = m[1].trim();
        if (v && v.length > 5) feedback.push(v);
      });
    }
  }
  scores.feedback = feedback.slice(0, 5);
  return scores;
}

async function onHintClick(idx) {
  const msg = STATE.conversation[idx];
  if (!msg || msg.role !== 'staff') return;
  if (msg.hintLoading) return;
  // Toggle if already loaded
  if (msg.hintText) {
    msg.hintShown = !msg.hintShown;
    renderRoleplay();
    return;
  }
  // Need to fetch
  msg.hintLoading = true;
  renderRoleplay();
  const langName = STATE.lang === 'zh' ? 'Chinese' : 'English';
  const prevCustomer = idx > 0 ? STATE.conversation[idx - 1] : null;
  const userMsg = `[COACH_HINT] Coach this single moment in the roleplay.

Scenario: ${STATE.scenario.title_en}. Customer profile: ${STATE.scenario.profile_en}. Concern: ${STATE.scenario.concern_en}.

${prevCustomer ? `Customer just said: "${prevCustomer.text}"` : ''}
Sales replied: "${msg.text}"

In ${langName}, give a short coach hint in EXACTLY this format (see TEACHING PHILOSOPHY in your system prompt). No JSON, no headings, just plain text in this structure:

Diagnose: one sentence on what the sales reply did or missed.

Three valid paths from here:
A) [Card name] -> [Card name]: "[example line]"
B) [Card name] -> [Card name]: "[example line]"
C) [Card name] -> [Card name]: "[example line]"

Principle: one short sentence on the underlying rule (e.g. "Any close works after the right frame" or "Frame -> Value -> Close, in that order").

Total under 130 words. Show options. Do NOT prescribe one answer. Teach judgment.`;
  let raw = '';
  try { raw = await callClaude([{ role: 'user', content: userMsg }], 700); }
  catch (e) {
    if (e.message === 'NO_KEY') { showApiKeyModal(false); msg.hintLoading = false; renderRoleplay(); return; }
    raw = '';
  }
  msg.hintLoading = false;
  msg.hintText = (raw || '').trim() || t('hint.fail');
  msg.hintShown = true;
  renderRoleplay();
}

async function onSendReply() {
  if (STATE.busy) return;
  const ta = document.getElementById('reply');
  const text = (ta.value || '').trim();
  if (!text) return;
  STATE.conversation.push({ role: 'staff', text });
  STATE.busy = true;
  renderRoleplay();
  const c = document.getElementById('content');
  c.insertAdjacentHTML('beforeend', `<div class="loading" id="lo">${t('customer.thinking')}</div>`);
  const langName = STATE.lang === 'zh' ? 'Chinese' : 'English';
  const scenarioBrief = `[ROLEPLAY] You are the customer in this scenario. Title: ${STATE.scenario.title_en}. Profile: ${STATE.scenario.profile_en}. Concern: ${STATE.scenario.concern_en}. Reply in ${langName}. Stay in character. 1-3 sentences.`;
  const messages = [{ role: 'user', content: scenarioBrief }];
  STATE.conversation.forEach((m, i) => {
    if (i === 0 && m.role === 'customer') {
      messages.push({ role: 'assistant', content: m.text });
    } else if (m.role === 'staff') {
      messages.push({ role: 'user', content: m.text });
    } else {
      messages.push({ role: 'assistant', content: m.text });
    }
  });
  let reply = '';
  try { reply = await callClaude(messages, 300); }
  catch (e) {
    if (e.message === 'NO_KEY') { showApiKeyModal(false); STATE.busy = false; renderRoleplay(); return; }
    reply = '';
    STATE.lastRaw = e.message;
  }
  reply = (reply || '').trim().replace(/^(Customer|客户|Sales|销售|Consultant)[:：\s]*/i, '');
  if (!reply) reply = STATE.lang === 'zh' ? '(系统繁忙 请重试)' : '(System busy, please retry)';
  STATE.conversation.push({ role: 'customer', text: reply });
  STATE.busy = false;
  renderRoleplay();
}

async function onGradeRoleplay() {
  if (STATE.busy) return;
  STATE.busy = true;
  const out = document.getElementById('grade-out');
  out.innerHTML = `<div class="loading">${t('grading')}</div>`;
  const transcript = STATE.conversation.map(m => `${m.role === 'customer' ? 'CUSTOMER' : 'SALES'}: ${m.text}`).join('\n');
  const result = await gradeAi(transcript, STATE.scenario);
  STATE.busy = false;
  if (!result.parsed) { showGradeError(out, result.raw); return; }
  const total = computeTotal(result.parsed);
  const ts = Date.now();
  const sessionData = {
    ts,
    type: 'chat',
    scenario: tx(STATE.scenario.title_en, STATE.scenario.title_zh),
    scenarioId: STATE.scenario.id,
    score: total,
    breakdown: result.parsed,
    transcript,
    conversation: STATE.conversation.map(m => ({ role: m.role, text: m.text, hintText: m.hintText || '' }))
  };
  saveSession(sessionData);
  STATE.currentGrade = sessionData;
  renderScoreCard(out, result.parsed, total);
}

function computeTotal(parsed) {
  const dims = ['profile', 'frame', 'root', 'reframe', 'close_dim', 'compliance', 'authority'];
  let total = 0;
  dims.forEach(d => { if (parsed[d] !== undefined) total += (parsed[d] || 0); });
  return total;
}

function maxScore(parsed) {
  const dims = ['profile', 'frame', 'root', 'reframe', 'close_dim', 'compliance', 'authority'];
  let count = 0;
  dims.forEach(d => { if (parsed[d] !== undefined) count++; });
  return count * 2;
}

async function gradeAi(transcript, scenario) {
  const langName = STATE.lang === 'zh' ? 'Chinese' : 'English';
  const userMsg = `[GRADE] Score the SALES side of this conversation against the 4D rubric. Output ONLY valid JSON. No prose, no code fences, no preamble.

Scenario: ${scenario.title_en}. Customer profile: ${scenario.profile_en}. Concern: ${scenario.concern_en}.

TRANSCRIPT:
${transcript}

Score each of 6 dimensions 0-2: profile, frame, root, reframe, close_dim, compliance.

Output exactly 6 feedback points, ONE FOR EACH DIMENSION. Order: profile, frame, root, reframe, close_dim, compliance. Each feedback is an OBJECT with:
- "dim": the dimension name (must match the order above)
- "text": the coaching point in ${langName}, under 80 words.

The "text" must follow this teaching format (see TEACHING PHILOSOPHY in your system prompt):
1. Acknowledge what the salesperson did at a specific moment (cite the moment).
2. Show 2-3 ALTERNATIVE valid paths they could have taken, using DIFFERENT 4D card combinations. Name the cards explicitly.
3. End with the underlying principle.
Where relevant, briefly connect to one of the 7 May gaps by number, e.g. "(May Gap #5 - weak fear conversion)".

If a dimension is already strong (score 2), still write a brief feedback acknowledging what they did well and one alternative card they could have used as variation. Keep it under 50 words for strong dimensions.

Do NOT prescribe one right answer. Show options. Teach judgment.

Required JSON format exactly:
{"profile":N,"frame":N,"root":N,"reframe":N,"close_dim":N,"compliance":N,"feedback":[{"dim":"profile","text":"..."},{"dim":"frame","text":"..."},{"dim":"root","text":"..."},{"dim":"reframe","text":"..."},{"dim":"close_dim","text":"..."},{"dim":"compliance","text":"..."}]}`;
  let raw = '';
  try { raw = await callClaude([{ role: 'user', content: userMsg }], 3500); }
  catch (e) {
    if (e.message === 'NO_KEY') showApiKeyModal(false);
    raw = e.message;
  }
  STATE.lastRaw = raw || '(empty response)';
  return { parsed: parseGradeJson(raw), raw };
}

function showGradeError(out, raw) {
  out.innerHTML = `<div class="error-box"><div>${t('grade.fail')}</div><details style="margin-top:6px;"><summary style="cursor:pointer;">${t('grade.show_raw')}</summary><pre>${escapeHtml(raw || '(empty)')}</pre></details></div><div style="height:8px;"></div><button class="btn btn-secondary" id="retry">${t('try.again')}</button>`;
  document.getElementById('retry').onclick = () => { if (STATE.tab === 'roleplay') onGradeRoleplay(); else if (STATE.tab === 'voice') onGradeVoice(); };
}

function renderScoreCard(container, r, total) {
  const dim = (id, name) => {
    if (r[id] === undefined) return '';
    const v = r[id] || 0;
    const pct = (v / 2) * 100;
    return `<div class="score-row"><span>${name}</span><div class="score-bar"><div class="score-bar-fill" style="width:${pct}%"></div></div><span style="font-weight:600;">${v}/2</span></div>`;
  };
  const dimLabels = { profile: t('rubric.profile'), frame: t('rubric.frame'), root: t('rubric.root'), reframe: t('rubric.reframe'), close_dim: t('rubric.close'), compliance: t('rubric.compliance'), authority: t('rubric.authority') };
  const fb = (r.feedback || []);
  const fbHtml = fb.length ? fb.map((f, idx) => {
    if (typeof f === 'string') return `<div class="feedback-item">${escapeHtml(f)}</div>`;
    const d = f.dim || '';
    const label = dimLabels[d] || d;
    const badge = d ? `<span class="dim-badge dim-${escapeHtml(d)}">${label}</span>` : '';
    let expansionBlock = '';
    if (f.expandedLoading) {
      expansionBlock = `<div class="expanded-feedback-loading">${t('expanding')}</div>`;
    } else if (f.expanded && f.showExpanded) {
      expansionBlock = `<div class="expanded-feedback">${escapeHtml(f.expanded)}</div>`;
    }
    const btnLabel = f.expanded && f.showExpanded ? t('say.less') : t('say.more');
    const btnIcon = f.expanded && f.showExpanded ? '▲' : '🔍';
    const btn = `<button class="say-more-btn" data-fb-idx="${idx}" ${f.expandedLoading ? 'disabled' : ''}>${btnIcon} ${btnLabel}</button>`;
    return `<div class="feedback-item cat-${escapeHtml(d)}">${badge}${escapeHtml(f.text || f.comment || '')}${expansionBlock}<div>${btn}</div></div>`;
  }).join('') : `<div class="feedback-item">${t('fb.placeholder1')}</div>`;
  const max = maxScore(r);
  container.innerHTML = `<div class="card" style="margin-top:14px;"><div class="card-title">${t('total.score')} ${total}/${max}</div><div class="card-meta">${t('recorded')}</div><hr class="sep">${dim('profile', t('rubric.profile'))}${dim('frame', t('rubric.frame'))}${dim('root', t('rubric.root'))}${dim('reframe', t('rubric.reframe'))}${dim('close_dim', t('rubric.close'))}${dim('compliance', t('rubric.compliance'))}${dim('authority', t('rubric.authority'))}<div class="feedback-section"><div class="feedback-title">${t('feedback.title')}</div>${fbHtml}</div></div>`;
  container.querySelectorAll('.say-more-btn').forEach(b => {
    b.onclick = () => onSayMore(parseInt(b.getAttribute('data-fb-idx'), 10));
  });
}

async function onSayMore(idx) {
  const isViewingSession = !!STATE.viewingSession;
  const grade = isViewingSession ? STATE.viewingSession : STATE.currentGrade;
  if (!grade || !grade.breakdown || !grade.breakdown.feedback) return;
  const fb = grade.breakdown.feedback[idx];
  if (!fb || typeof fb === 'string') return;

  // Toggle visibility if already expanded
  if (fb.expanded) {
    fb.showExpanded = !fb.showExpanded;
    rerenderActiveGrade();
    return;
  }

  // Need to fetch
  fb.expandedLoading = true;
  rerenderActiveGrade();

  const langName = STATE.lang === 'zh' ? 'Chinese' : 'English';
  const dimMap = { profile: 'Profile (customer type identification)', frame: 'Frame (which FRAME card from 4D library)', root: 'Root cause (real fear vs surface objection)', reframe: 'Reframe (using ELITE REFRAME or ROOT card)', close_dim: 'Close (named close from 4D library)', compliance: 'Compliance (safe wording, doctor escalation, controlled claims)' };
  const dimDesc = dimMap[fb.dim] || fb.dim;
  const transcriptText = grade.transcript || (grade.conversation || []).map(m => (m.role === 'customer' ? 'CUSTOMER: ' : 'SALES: ') + m.text).join('\n');

  const prompt = `[SAY MORE] Expand on a previous feedback with a deeper coaching analysis.

Dimension being expanded: ${dimDesc}
Your previous short feedback was: "${fb.text}"

CONVERSATION:
${transcriptText}

Now write 200-300 words in ${langName}. Plain text. No JSON. No headings. No code fences.

Cover in this order, in flowing paragraphs:
1. Why this moment matters strategically. Connect to one of the 7 May gaps if relevant.
2. The psychological pattern at play with this customer type. What is she really afraid of or wanting?
3. 4-5 specific 4D card combinations that could have worked, ranked from safest to most advanced. Name each card explicitly.
4. The most common mistake in this exact situation and how to avoid it.
5. The deeper principle that ties it all together.

Build on the short feedback. Do NOT repeat it. Be specific, not generic.`;

  let raw = '';
  try { raw = await callClaude([{ role: 'user', content: prompt }], 1500); }
  catch (e) {
    if (e.message === 'NO_KEY') { showApiKeyModal(false); fb.expandedLoading = false; rerenderActiveGrade(); return; }
    raw = '';
  }
  fb.expandedLoading = false;
  fb.expanded = (raw || '').trim() || t('expand.fail');
  fb.showExpanded = true;

  // Persist back to localStorage so next time you open this drill it remembers
  if (grade.ts) {
    updateSession(grade.ts, { breakdown: grade.breakdown });
  }

  rerenderActiveGrade();
}

  // Voice tab is now Consultant Demo mode: user plays customer, AI plays consultant.
  const c = document.getElementById('content');

    c.querySelectorAll('[data-level]').forEach(b => { b.onclick = () => { STATE.scenarioLevel = parseInt(b.getAttribute('data-level'), 10); renderVoice(); }; });
    c.querySelectorAll('.scenario-card').forEach(b => {
      b.onclick = () => {
        const id = b.getAttribute('data-scen');
        STATE.scenario = SCENARIOS.find(s => s.id === id);
        const greeting = STATE.lang === 'zh' ? t('demo.greetingZh') : t('demo.greetingEn');
        STATE.conversation = [{ role: 'consultant', text: greeting, card: 'Welcome / Reassure' }];
        renderVoice();
      };
    });
    return;
  }
  const s = STATE.scenario;
  const renderMsg = (m) => {
    if (m.role === 'consultant') {
      const bubble = `<div class="bubble customer"><div class="bubble-label">${t('demo.consultantTag')}</div>${escapeHtml(m.text)}</div>`;
      const tag = m.card ? `<div class="card-tag">${escapeHtml(m.card)}</div>` : '';
      return bubble + tag;
    }
    return `<div class="bubble staff"><div class="bubble-label">${t('demo.youTag')}</div>${escapeHtml(m.text)}</div>`;
  };
  c.innerHTML = `<button class="back-btn" id="back">${t('change.scenario')}</button><div class="card"><div><span class="level-pill level-${s.level}">${s.src}</span><span style="font-weight:600;">${tx(s.title_en, s.title_zh)}</span></div><div class="card-meta" style="margin-top:4px;">${t('demo.youplay')}</div><div class="card-body">${tx(s.profile_en, s.profile_zh)}</div><div class="card-body" style="margin-top:6px;"><span style="color:var(--text-secondary);">${t('concern')}:</span> ${tx(s.concern_en, s.concern_zh)}</div></div><div class="chat" id="chat">${STATE.conversation.map(renderMsg).join('')}</div><textarea class="textarea" id="reply" placeholder="${t('demo.startReply')}"></textarea><div style="display:flex; gap:6px; margin-top:8px;"><button class="btn btn-secondary" id="mic-btn" style="flex:1; padding:12px 8px;">${STATE.recording ? `<span class="recording-pulse"></span>${t('mic.stop')}` : t('mic.start')}</button><button class="btn" id="send" style="flex:2;" ${STATE.busy ? 'disabled' : ''}>${t('btn.send')}</button></div>`;
  document.getElementById('back').onclick = () => { stopRecognition(); STATE.scenario = null; STATE.conversation = []; renderVoice(); };
  document.getElementById('send').onclick = () => { stopRecognition(); onSendDemoReply(); };
  document.getElementById('mic-btn').onclick = toggleRecordForReply;
  setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50);
}

async function onSendDemoReply() {
  if (STATE.busy) return;
  const ta = document.getElementById('reply');
  const text = (ta.value || '').trim();
  if (!text) return;
  STATE.conversation.push({ role: 'customer-user', text });
  STATE.busy = true;
  renderVoice();
  const c = document.getElementById('content');
  c.insertAdjacentHTML('beforeend', `<div class="loading" id="lo">${STATE.lang === 'zh' ? '顾问思考中...' : 'Consultant thinking...'}</div>`);
  const langName = STATE.lang === 'zh' ? 'Chinese' : 'English';
  const sys = `[CONSULTANT_DEMO] You are the senior Emax consultant. The trainee is roleplaying as customer persona: ${STATE.scenario.src} - ${STATE.scenario.title_en}. Profile: ${STATE.scenario.profile_en}. Concern: ${STATE.scenario.concern_en}. Reply in ${langName}. Use the 4D system. End your reply with a card tag on a new line: <<Card: card name>>.`;
  const messages = [{ role: 'user', content: sys }];
  STATE.conversation.forEach((m, i) => {
    if (i === 0 && m.role === 'consultant') {
      messages.push({ role: 'assistant', content: m.text + (m.card ? '\n<<Card: ' + m.card + '>>' : '') });
    } else if (m.role === 'customer-user') {
      messages.push({ role: 'user', content: m.text });
    } else {
      messages.push({ role: 'assistant', content: m.text + (m.card ? '\n<<Card: ' + m.card + '>>' : '') });
    }
  });
  let raw = '';
  try { raw = await callClaude(messages, 600); }
  catch (e) {
    if (e.message === 'NO_KEY') { showApiKeyModal(false); STATE.busy = false; renderVoice(); return; }
    raw = '';
  }
  raw = (raw || '').trim();
  const cardMatch = raw.match(/<<Card:\s*([^>]+)>>/);
  const card = cardMatch ? cardMatch[1].trim() : '';
  const cleanText = raw.replace(/<<Card:[^>]+>>\s*$/m, '').trim();
  STATE.conversation.push({ role: 'consultant', text: cleanText || '...', card });
  if (ta) ta.value = '';
  STATE.busy = false;
  renderVoice();
}

function stopRecognition() { if (STATE.recognition) { try { STATE.recognition.stop(); } catch (e) {} STATE.recognition = null; } STATE.recording = false; }

function setMicBtnState(recording) {
  const btn = document.getElementById('mic-btn');
  if (!btn) return;
  if (recording) {
    btn.innerHTML = `<span class="recording-pulse"></span>${t('mic.stop')}`;
  } else {
    btn.innerHTML = t('mic.start');
  }
}

function toggleRecordForReply() {
  if (STATE.recording) {
    stopRecognition();
    setMicBtnState(false);
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert(t('mic.unsupported')); return; }
  const replyEl = document.getElementById('reply');
  if (!replyEl) return;
  let baseText = replyEl.value || '';
  if (baseText && !baseText.endsWith(' ') && !baseText.endsWith('\n')) baseText += ' ';
  let finalText = baseText;
  const rec = new SR();
  rec.lang = STATE.lang === 'zh' ? 'zh-CN' : 'en-US';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    if (replyEl) replyEl.value = finalText + (interim ? ' ' + interim : '');
  };
  rec.onerror = (e) => {
    if (e.error === 'not-allowed') alert(t('mic.denied'));
  };
  rec.onend = () => {
    STATE.recording = false;
    STATE.recognition = null;
    setMicBtnState(false);
  };
  try {
    rec.start();
    STATE.recognition = rec;
    STATE.recording = true;
    setMicBtnState(true);
  } catch (e) {
    alert('Start record failed ' + (e.message || ''));
  }
}

function toggleRecord() {
  if (STATE.recording) { stopRecognition(); renderVoice(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert(STATE.lang === 'zh' ? '当前浏览器不支持语音识别' : 'Speech recognition not supported in this browser'); return; }
  const rec = new SR();
  rec.lang = STATE.lang === 'zh' ? 'zh-CN' : 'en-US';
  rec.continuous = true; rec.interimResults = true;
  let finalText = STATE.voiceTranscript || '';
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    STATE.voiceTranscript = finalText;
    const tEl = document.getElementById('transcript');
    if (tEl) tEl.textContent = finalText + (interim ? ' ' + interim : '');
  };
  rec.onerror = (e) => { if (e.error === 'not-allowed') alert(STATE.lang === 'zh' ? '麦克风权限被拒绝' : 'Microphone permission denied'); };
  rec.onend = () => { STATE.recording = false; STATE.recognition = null; if (STATE.tab === 'voice' && STATE.scenario) renderVoice(); };
  try { rec.start(); STATE.recognition = rec; STATE.recording = true; renderVoice(); }
  catch (e) { alert('Start record failed ' + (e.message || '')); }
}

async function onGradeVoice() {
  if (STATE.busy || !STATE.voiceTranscript) return;
  STATE.busy = true;
  const out = document.getElementById('grade-out');
  out.innerHTML = `<div class="loading">${t('grading')}</div>`;
  const transcript = `CUSTOMER: ${STATE.scenario.open_en}\nSALES: ${STATE.voiceTranscript}`;
  const result = await gradeAi(transcript, STATE.scenario);
  STATE.busy = false;
  if (!result.parsed) { showGradeError(out, result.raw); return; }
  const total = computeTotal(result.parsed);
  const ts = Date.now();
  const sessionData = {
    ts,
    type: 'voice',
    scenario: tx(STATE.scenario.title_en, STATE.scenario.title_zh),
    scenarioId: STATE.scenario.id,
    score: total,
    breakdown: result.parsed,
    transcript: STATE.voiceTranscript
  };
  saveSession(sessionData);
  STATE.currentGrade = sessionData;
  renderScoreCard(out, result.parsed, total);
}

// ============ Dashboard ============
function renderDashboard() {
  const c = document.getElementById('content');
  const sessions = loadSessions();
  const total = sessions.length;
  const avg = total ? (sessions.reduce((a, s) => a + (s.score || 0), 0) / total).toFixed(1) : '—';
  const last7 = sessions.filter(s => Date.now() - s.ts < 7 * 24 * 3600 * 1000).length;
  let weakest = '—';
  if (total > 0) {
    const sums = { profile: 0, frame: 0, root: 0, reframe: 0, close_dim: 0, compliance: 0 };
    const counts = { profile: 0, frame: 0, root: 0, reframe: 0, close_dim: 0, compliance: 0 };
    sessions.forEach(s => {
      const b = s.breakdown || {};
      Object.keys(sums).forEach(k => {
        if (b[k] !== undefined) { sums[k] += (b[k] || 0); counts[k] += 1; }
      });
    });
    // Compute weakest as average score per dim, only counting dims with data
    let min = Infinity, minKey = null;
    Object.keys(sums).forEach(k => {
      if (counts[k] > 0) {
        const avg = sums[k] / counts[k];
        if (avg < min) { min = avg; minKey = k; }
      }
    });
    const map = { profile: t('rubric.profile'), frame: t('rubric.frame'), root: t('rubric.root'), reframe: t('rubric.reframe'), close_dim: t('rubric.close'), compliance: t('rubric.compliance') };
    weakest = map[minKey] || '—';
  }
  const recent = sessions.slice(0, 10);
  c.innerHTML = `<div class="stat-row"><div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">${t('stat.total')}</div></div><div class="stat-card"><div class="stat-num">${avg}</div><div class="stat-label">${t('stat.avg')}</div></div><div class="stat-card"><div class="stat-num">${last7}</div><div class="stat-label">${t('stat.last7')}</div></div></div><div class="card"><div class="card-title">${t('weakest.dim')}</div><div class="card-body" style="margin-top:6px;">${weakest}</div><div class="card-meta" style="margin-top:6px;">${t('coach.action')}</div></div><div class="section-title">${t('recent.drills')}</div>${recent.length === 0 ? `<div class="empty">${t('no.records')}</div>` : recent.map((s, i) => { const m = s.breakdown ? maxScore(s.breakdown) : 10; return `<div class="card session-card" data-idx="${i}" style="cursor:pointer;"><div style="display:flex; justify-content:space-between; align-items:center; gap:12px;"><div style="flex:1; min-width:0;"><div class="card-title">${escapeHtml(s.scenario)}</div><div class="card-meta">${s.type === 'voice' ? t('voice.text') : t('chat.text')} · ${formatTs(s.ts)}</div></div><div style="font-size:20px; font-weight:600; color:var(--accent);">${s.score}/${m}</div></div></div>`; }).join('')}<div style="height:14px;"></div><button class="btn btn-secondary" id="clear">${t('clear.records')}</button><div style="font-size:11px; color:var(--text-secondary); margin-top:10px; text-align:center;">${t('data.note')}</div>`;
  document.getElementById('clear').onclick = () => { if (confirm(t('clear.confirm'))) { localStorage.removeItem(SK.sessions); renderDashboard(); } };
  document.querySelectorAll('.session-card').forEach(b => {
    b.onclick = () => {
      const idx = parseInt(b.getAttribute('data-idx'), 10);
      STATE.viewingSession = sessions[idx];
      renderSessionDetail();
    };
  });
}

function renderSessionDetail() {
  const s = STATE.viewingSession;
  const c = document.getElementById('content');
  if (!s) { renderDashboard(); return; }
  const max = s.breakdown ? maxScore(s.breakdown) : 10;
  c.innerHTML = `
    <button class="back-btn" id="back">← ${t('back.dashboard')}</button>
    <div class="card">
      <div class="card-title">${escapeHtml(s.scenario)}</div>
      <div class="card-meta">${s.type === 'voice' ? t('voice.text') : t('chat.text')} · ${formatTs(s.ts)} · ${s.score}/${max}</div>
    </div>
    <div class="section-title">${(s.conversation && Array.isArray(s.conversation)) ? t('conversation.label') : t('transcript.label')}</div>
    <div id="conv-area"></div>
    <div class="section-title">${t('feedback.title')}</div>
    <div id="grade-area"></div>
  `;
  const convArea = document.getElementById('conv-area');
  if (s.conversation && Array.isArray(s.conversation)) {
    convArea.innerHTML = `<div class="chat">${s.conversation.map(m => {
      const bubble = `<div class="bubble ${m.role}"><div class="bubble-label">${m.role === 'customer' ? (STATE.lang === 'zh' ? '客户' : 'Customer') : (STATE.lang === 'zh' ? '你' : 'You')}</div>${escapeHtml(m.text)}</div>`;
      const hint = m.hintText ? `<div class="hint-card"><div class="hint-card-label">${t('hint.label')}</div>${escapeHtml(m.hintText)}</div>` : '';
      return bubble + hint;
    }).join('')}</div>`;
  } else if (s.transcript) {
    convArea.innerHTML = `<pre style="white-space:pre-wrap; font-size:13px; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); line-height:1.55; font-family:inherit;">${escapeHtml(s.transcript)}</pre>`;
  } else {
    convArea.innerHTML = `<div class="empty">${t('no.conv')}</div>`;
  }
  const gradeArea = document.getElementById('grade-area');
  if (s.breakdown) {
    renderScoreCard(gradeArea, s.breakdown, s.score);
  } else {
    gradeArea.innerHTML = `<div class="empty">${t('no.conv')}</div>`;
  }
  document.getElementById('back').onclick = () => { STATE.viewingSession = null; renderDashboard(); };
}

  const tail = k ? k.slice(-4) : '';
  const status = k ? t('settings.key_status_set').replace('{tail}', tail) : t('settings.key_status_unset');
  c.innerHTML = `<div class="card"><div class="card-title">${t('settings.apikey')}</div><div class="card-meta" style="margin-top:6px; ${k ? 'color: var(--success);' : 'color: var(--danger);'}">${status}</div><div style="height:10px;"></div><button class="btn" id="upd">${t('settings.update_key')}</button>${k ? `<div style="height:8px;"></div><button class="btn btn-danger" id="clr">${t('settings.clear_key')}</button>` : ''}</div><div class="card"><div class="card-title">${t('settings.about')}</div><div class="card-body" style="margin-top:6px;">${t('settings.about_body')}</div><div class="card-meta" style="margin-top:8px;">${t('settings.cost_note')}</div></div>`;
  document.getElementById('upd').onclick = () => showApiKeyModal(false);
  if (k) document.getElementById('clr').onclick = () => { if (confirm(t('settings.clear_confirm'))) { clearKey(); renderSettings(); } };
}

function formatTs(ts) {
  const d = new Date(ts);
  const diff = Date.now() - d.getTime();
  if (diff < 60000) return t('just.now');
  if (diff < 3600000) return Math.floor(diff / 60000) + ' ' + t('mins.ago');
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' ' + t('hours.ago');
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
}

// ============ Tab routing ============
function renderActiveTab() {
  if (STATE.tab === 'roleplay') renderRoleplay();
  else if (STATE.tab === 'voice') renderVoice();
  else if (STATE.tab === 'knowledge') renderKnowledge();
  else if (STATE.tab === 'dashboard') {
    if (STATE.viewingSession) renderSessionDetail();
    else renderDashboard();
  }
  else if (STATE.tab === 'settings') renderSettings();
}

function setTab(tab) {
  stopRecognition();
  STATE.tab = tab;
  STATE.scenario = null; STATE.conversation = []; STATE.voiceTranscript = ''; STATE.busy = false;
  STATE.viewingSession = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === tab));
  applyHeaderTitle();
  renderActiveTab();
  window.scrollTo(0, 0);
}

function applyHeaderTitle() {
  const map = { roleplay: 'header.roleplay', voice: 'header.voice', knowledge: 'header.knowledge', dashboard: 'header.dashboard', settings: 'header.settings' };
  const v = I18N[STATE.lang][map[STATE.tab]];
  document.getElementById('page-title').textContent = v[0];
  document.getElementById('page-sub').textContent = v[1];
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.documentElement.lang = STATE.lang === 'zh' ? 'zh-CN' : 'en';
}

async function setLang(l) {
  if (STATE.lang === l) return;
  STATE.lang = l; saveLang(l);
  document.getElementById('lang-en').classList.toggle('active', l === 'en');
  document.getElementById('lang-zh').classList.toggle('active', l === 'zh');
  applyHeaderTitle();
  // Capture textarea value (typed but unsent reply) so we can translate and restore
  const replyEl = document.getElementById('reply');
  STATE.pendingReplyText = replyEl ? (replyEl.value || '') : '';
  // If active session has dynamic AI content (or typed reply), translate it before re-render
  const hasDynamic = (STATE.tab === 'roleplay' && STATE.scenario && (STATE.conversation.length > 0 || STATE.pendingReplyText || (STATE.currentGrade && STATE.currentGrade.breakdown))) || (STATE.tab === 'voice' && STATE.scenario && (STATE.conversation.length > 0 || STATE.pendingReplyText)) || (STATE.tab === 'dashboard' && STATE.viewingSession);
  if (hasDynamic && loadKey()) {
    await translateActiveContent(l);
  }
  // Re-render current tab without resetting scenario state
  renderActiveTab();
  // Restore translated typed reply into the new textarea
  if (STATE.pendingReplyText) {
    const newReplyEl = document.getElementById('reply');
    if (newReplyEl) newReplyEl.value = STATE.pendingReplyText;
    STATE.pendingReplyText = '';
  }
}

// ============ Init ============
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.getAttribute('data-tab')));
document.getElementById('lang-en').onclick = () => setLang('en');
document.getElementById('lang-zh').onclick = () => setLang('zh');

STATE.lang = loadLang();
document.getElementById('lang-en').classList.toggle('active', STATE.lang === 'en');
document.getElementById('lang-zh').classList.toggle('active', STATE.lang === 'zh');
setTab('roleplay');

// First run: prompt for API key
if (!loadKey()) setTimeout(() => showApiKeyModal(true), 300);
</script>
